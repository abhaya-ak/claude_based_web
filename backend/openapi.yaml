openapi: 3.0.3
info:
  title: ScamShield API
  version: 1.0.0
  description: Scam reporting, lookup, and literacy platform REST API.
paths:
  /api/v1/admin-portal/rules/:
    get:
      operationId: admin_portal_rules_list
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - admin-portal
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedHeuristicRuleList'
          description: ''
    post:
      operationId: admin_portal_rules_create
      tags:
      - admin-portal
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HeuristicRuleRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/HeuristicRuleRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/HeuristicRuleRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeuristicRule'
          description: ''
  /api/v1/admin-portal/rules/{id}/:
    get:
      operationId: admin_portal_rules_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - admin-portal
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeuristicRule'
          description: ''
    put:
      operationId: admin_portal_rules_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - admin-portal
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HeuristicRuleRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/HeuristicRuleRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/HeuristicRuleRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeuristicRule'
          description: ''
    patch:
      operationId: admin_portal_rules_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - admin-portal
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedHeuristicRuleRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedHeuristicRuleRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedHeuristicRuleRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeuristicRule'
          description: ''
    delete:
      operationId: admin_portal_rules_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - admin-portal
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/admin-portal/scanner-config/:
    get:
      operationId: admin_portal_scanner_config_retrieve
      tags:
      - admin-portal
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScannerConfig'
          description: ''
    patch:
      operationId: admin_portal_scanner_config_partial_update
      tags:
      - admin-portal
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedScannerConfigRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedScannerConfigRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedScannerConfigRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScannerConfig'
          description: ''
  /api/v1/admin-portal/users/:
    get:
      operationId: admin_portal_users_list
      summary: Admin list users with optional status filter
      tags:
      - admin-portal
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminUser'
          description: ''
  /api/v1/admin-portal/users/{id}/approve/:
    post:
      operationId: admin_portal_users_approve_create
      summary: Admin approve pending staff user
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin-portal
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
  /api/v1/admin-portal/users/{id}/change-role/:
    post:
      operationId: admin_portal_users_change_role_create
      summary: Admin change approved staff user role
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin-portal
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeRoleRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangeRoleRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangeRoleRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
  /api/v1/admin-portal/users/{id}/reject/:
    post:
      operationId: admin_portal_users_reject_create
      summary: Admin reject pending staff user
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin-portal
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RejectUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RejectUserRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      summary: User login
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Access token returned and refresh cookie set
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      summary: User logout
      tags:
      - auth
      responses:
        '204':
          description: No response body
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      summary: Get current user profile
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
  /api/v1/auth/password/change/:
    post:
      operationId: auth_password_change_create
      summary: Change user password and revoke sessions
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/refresh/:
    post:
      operationId: auth_refresh_create
      summary: Refresh access token
      tags:
      - auth
      responses:
        '200':
          description: New access token returned and rotated cookie set
  /api/v1/auth/register/:
    post:
      operationId: auth_register_create
      summary: Citizen registration
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CitizenRegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CitizenRegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CitizenRegisterRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummary'
          description: ''
  /api/v1/auth/register/staff/:
    post:
      operationId: auth_register_staff_create
      summary: Staff registration (pending approval)
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffRegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StaffRegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StaffRegisterRequest'
        required: true
      responses:
        '201':
          description: Staff registration submitted
  /api/v1/health/:
    get:
      operationId: health_retrieve
      description: Returns 200 OK if the service is running.
      summary: Health check liveness
      tags:
      - health
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivenessResponse'
          description: ''
  /api/v1/health/ready/:
    get:
      operationId: health_ready_retrieve
      description: Returns 200 OK if the database is reachable and responsive.
      summary: Health check readiness
      tags:
      - health
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnavailableResponse'
          description: ''
  /api/v1/internal/scan-results/:
    post:
      operationId: internal_scan_results_create
      description: Receives scoring results from heuristic scanner Lambda, verified
        via HMAC-SHA256.
      summary: Internal scanner callback
      tags:
      - internal
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanResultCallbackRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ScanResultCallbackRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ScanResultCallbackRequest'
        required: true
      responses:
        '200':
          description: Scan result processed and saved successfully.
        '400':
          description: Validation error in result payload.
        '403':
          description: Invalid signature, bad timestamp, or clock skew.
        '404':
          description: Report not found.
        '429':
          description: Throttled.
  /api/v1/reports/:
    post:
      operationId: reports_create
      description: Submits a citizen scam report with 1 to 5 indicators and up to
        3 evidence files.
      summary: File a scam report
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
          format: uuid
        description: Optional idempotency key UUID to prevent duplicate submissions.
      tags:
      - reports
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReportCreateRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReportCreateRequestRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/ReportCreateRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportCreateResponse'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportCreateResponse'
          description: Idempotent replay of previously submitted report.
        '400':
          description: Validation error
        '413':
          description: Payload exceeds 16 MB limit
        '429':
          description: Rate limit exceeded
  /api/v1/reports/mine/:
    get:
      operationId: reports_mine_list
      description: Authenticated list of non-anonymous reports submitted by the caller.
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - reports
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMyReportItemList'
          description: ''
  /api/v1/reports/options/:
    get:
      operationId: reports_options_retrieve
      description: Public endpoint returning enums and country-specific allow-lists.
      summary: Retrieve report submission options and allow-lists
      tags:
      - reports
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportOptionsResponse'
          description: ''
  /api/v1/reports/track/:
    post:
      operationId: reports_track_create
      description: Public tracking endpoint. Returns uniform 404 for unknown references
        and invalid keys.
      summary: Track status of a filed report
      tags:
      - reports
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportTrackRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReportTrackRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReportTrackRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportTrackResponse'
          description: ''
        '404':
          description: Report not found
        '429':
          description: Too many failed tracking attempts
components:
  schemas:
    AdminUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        full_name:
          type: string
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/UserRoleEnum'
          readOnly: true
        approval_status:
          allOf:
          - $ref: '#/components/schemas/ApprovalStatusEnum'
          readOnly: true
        organization:
          type: string
          readOnly: true
          nullable: true
        credential_note:
          type: string
          readOnly: true
          nullable: true
        rejection_reason:
          type: string
          readOnly: true
          nullable: true
        approved_by:
          type: string
          format: uuid
          nullable: true
          readOnly: true
        approved_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        is_active:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - approval_status
      - approved_at
      - approved_by
      - created_at
      - credential_note
      - email
      - full_name
      - id
      - is_active
      - organization
      - rejection_reason
      - role
    ApprovalStatusEnum:
      enum:
      - APPROVED
      - PENDING
      - REJECTED
      type: string
      description: |-
        * `APPROVED` - Approved
        * `PENDING` - Pending
        * `REJECTED` - Rejected
    CategoryEnum:
      enum:
      - PHISHING
      - FAKE_JOB
      - ECOMMERCE_FRAUD
      - IMPERSONATION
      - OTHER
      type: string
      description: |-
        * `PHISHING` - Phishing
        * `FAKE_JOB` - Fake Job
        * `ECOMMERCE_FRAUD` - E-commerce Fraud
        * `IMPERSONATION` - Impersonation
        * `OTHER` - Other
    ChangeRoleRequest:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/UserRoleEnum'
      required:
      - role
    CitizenRegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
        full_name:
          type: string
          minLength: 1
          maxLength: 150
        role:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - full_name
      - password
    CountryCodeEnum:
      enum:
      - MY
      - NP
      - ZZ
      type: string
      description: |-
        * `MY` - MY
        * `NP` - NP
        * `ZZ` - ZZ
    CurrencyEnum:
      enum:
      - MYR
      - NPR
      - USD
      type: string
      description: |-
        * `MYR` - MYR
        * `NPR` - NPR
        * `USD` - USD
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              nullable: true
            request_id:
              type: string
          required:
          - code
          - message
          - details
          - request_id
      required:
      - error
    HeuristicRule:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        rule_type:
          $ref: '#/components/schemas/RuleTypeEnum'
        pattern:
          type: string
          maxLength: 100
        weight:
          type: integer
          maximum: 50
          minimum: 1
        is_active:
          type: boolean
          default: true
        created_by:
          type: string
          format: uuid
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - created_by
      - id
      - pattern
      - rule_type
      - updated_at
      - weight
    HeuristicRuleRequest:
      type: object
      properties:
        rule_type:
          $ref: '#/components/schemas/RuleTypeEnum'
        pattern:
          type: string
          minLength: 1
          maxLength: 100
        weight:
          type: integer
          maximum: 50
          minimum: 1
        is_active:
          type: boolean
          default: true
      required:
      - pattern
      - rule_type
      - weight
    LivenessResponse:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - password
    MyReportItem:
      type: object
      properties:
        reference_code:
          type: string
          maxLength: 24
        category:
          $ref: '#/components/schemas/CategoryEnum'
        platform:
          $ref: '#/components/schemas/PlatformEnum'
        status:
          $ref: '#/components/schemas/StatusEnum'
        financial_loss:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        currency:
          type: string
          maxLength: 3
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - category
      - created_at
      - currency
      - platform
      - reference_code
    PaginatedHeuristicRuleList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/HeuristicRule'
    PaginatedMyReportItemList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/MyReportItem'
    PasswordChangeRequest:
      type: object
      properties:
        current_password:
          type: string
          writeOnly: true
          minLength: 1
        new_password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - current_password
      - new_password
    PatchedHeuristicRuleRequest:
      type: object
      properties:
        rule_type:
          $ref: '#/components/schemas/RuleTypeEnum'
        pattern:
          type: string
          minLength: 1
          maxLength: 100
        weight:
          type: integer
          maximum: 50
          minimum: 1
        is_active:
          type: boolean
          default: true
    PatchedScannerConfigRequest:
      type: object
      properties:
        keyword_cap_points:
          type: integer
          maximum: 100
          minimum: 0
        ip_url_points:
          type: integer
          maximum: 100
          minimum: 0
        prior_pending_points:
          type: integer
          maximum: 100
          minimum: 0
        high_priority_threshold:
          type: integer
          maximum: 100
          minimum: 1
    PaymentMethodEnum:
      enum:
      - NONE
      - BANK_TRANSFER
      - E_WALLET
      - CARD
      - CRYPTO
      - CASH
      - OTHER
      type: string
      description: |-
        * `NONE` - None
        * `BANK_TRANSFER` - Bank Transfer
        * `E_WALLET` - E-Wallet
        * `CARD` - Card
        * `CRYPTO` - Crypto
        * `CASH` - Cash
        * `OTHER` - Other
    PlatformEnum:
      enum:
      - WHATSAPP
      - TELEGRAM
      - FACEBOOK
      - EMAIL
      - SMS
      - WEBSITE
      - OTHER
      type: string
      description: |-
        * `WHATSAPP` - WhatsApp
        * `TELEGRAM` - Telegram
        * `FACEBOOK` - Facebook
        * `EMAIL` - Email
        * `SMS` - SMS
        * `WEBSITE` - Website
        * `OTHER` - Other
    Playbook:
      type: object
      properties:
        title:
          type: string
          maxLength: 150
        steps:
          type: array
          items:
            $ref: '#/components/schemas/Step'
        hotlines:
          type: array
          items:
            type: object
            additionalProperties: {}
      required:
      - steps
      - title
    ReadinessResponse:
      type: object
      properties:
        status:
          type: string
        database:
          type: string
      required:
      - database
      - status
    RejectUserRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 300
      required:
      - reason
    ReportCreateRequestRequest:
      type: object
      properties:
