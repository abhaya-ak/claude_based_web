components:
  schemas:
    AdminUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        full_name:
          type: string
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/UserRoleEnum'
          readOnly: true
        approval_status:
          allOf:
          - $ref: '#/components/schemas/ApprovalStatusEnum'
          readOnly: true
        organization:
          type: string
          readOnly: true
          nullable: true
        credential_note:
          type: string
          readOnly: true
          nullable: true
        rejection_reason:
          type: string
          readOnly: true
          nullable: true
        approved_by:
          type: string
          format: uuid
          nullable: true
          readOnly: true
        approved_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        is_active:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - approval_status
      - approved_at
      - approved_by
      - created_at
      - credential_note
      - email
      - full_name
      - id
      - is_active
      - organization
      - rejection_reason
      - role
    ApprovalStatusEnum:
      enum:
      - APPROVED
      - PENDING
      - REJECTED
      type: string
      description: |-
        * `APPROVED` - Approved
        * `PENDING` - Pending
        * `REJECTED` - Rejected
    AreaLosses:
      type: object
      properties:
        country:
          type: string
        admin_area:
          type: string
          nullable: true
        currency:
          type: string
        total_loss:
          type: string
        report_count:
          type: integer
      required:
      - admin_area
      - country
      - currency
      - report_count
      - total_loss
    AssetTypeEnum:
      enum:
      - PDF
      - AUDIO
      - IMAGE
      type: string
      description: |-
        * `PDF` - PDF Document
        * `AUDIO` - Audio
        * `IMAGE` - Image
    AudienceGroupEnum:
      enum:
      - GENERAL
      - ELDERLY
      - TEENAGER
      - NON_TECH
      type: string
      description: |-
        * `GENERAL` - General Public
        * `ELDERLY` - Seniors & family
        * `TEENAGER` - Teenagers & Students
        * `NON_TECH` - Non-Technical Users
    BlankEnum:
      enum:
      - ''
    CategoryVolume:
      type: object
      properties:
        category:
          type: string
        count:
          type: integer
      required:
      - category
      - count
    ChangeRoleRequest:
      type: object
      properties:
        role:
          $ref: '#/components/schemas/UserRoleEnum'
      required:
      - role
    ChannelEnum:
      enum:
      - EMAIL
      - SMS
      type: string
      description: |-
        * `EMAIL` - Email
        * `SMS` - SMS
    CitizenRegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
        full_name:
          type: string
          minLength: 1
          maxLength: 150
        role:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - full_name
      - password
    CountryCodeEnum:
      enum:
      - MY
      - NP
      - ZZ
      type: string
      description: |-
        * `MY` - MY
        * `NP` - NP
        * `ZZ` - ZZ
    CountryLosses:
      type: object
      properties:
        country:
          type: string
        currency:
          type: string
        total_loss:
          type: string
        report_count:
          type: integer
      required:
      - country
      - currency
      - report_count
      - total_loss
    CurrencyEnum:
      enum:
      - MYR
      - NPR
      - USD
      type: string
      description: |-
        * `MYR` - MYR
        * `NPR` - NPR
        * `USD` - USD
    DailyVolume:
      type: object
      properties:
        date:
          type: string
        count:
          type: integer
      required:
      - count
      - date
    EducationalGuideCreateUpdate:
      type: object
      properties:
        title:
