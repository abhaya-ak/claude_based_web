openapi: 3.0.3
info:
  title: ScamShield API
  version: 1.0.0
  description: Scam reporting, lookup, and literacy platform REST API.
paths:
  /api/v1/admin-portal/rules/:
    get:
      operationId: admin_portal_rules_list
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - admin-portal
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedHeuristicRuleList'
          description: ''
    post:
      operationId: admin_portal_rules_create
      tags:
      - admin-portal
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HeuristicRuleRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/HeuristicRuleRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/HeuristicRuleRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeuristicRule'
          description: ''
  /api/v1/admin-portal/rules/{id}/:
    get:
      operationId: admin_portal_rules_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - admin-portal
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeuristicRule'
          description: ''
    put:
      operationId: admin_portal_rules_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - admin-portal
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HeuristicRuleRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/HeuristicRuleRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/HeuristicRuleRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeuristicRule'
          description: ''
    patch:
      operationId: admin_portal_rules_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - admin-portal
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedHeuristicRuleRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedHeuristicRuleRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedHeuristicRuleRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeuristicRule'
          description: ''
    delete:
      operationId: admin_portal_rules_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - admin-portal
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/admin-portal/scanner-config/:
    get:
      operationId: admin_portal_scanner_config_retrieve
      tags:
      - admin-portal
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScannerConfig'
          description: ''
    patch:
      operationId: admin_portal_scanner_config_partial_update
      tags:
      - admin-portal
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedScannerConfigRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedScannerConfigRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedScannerConfigRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScannerConfig'
          description: ''
  /api/v1/admin-portal/users/:
    get:
      operationId: admin_portal_users_list
      summary: Admin list users with optional status filter
      tags:
      - admin-portal
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminUser'
          description: ''
  /api/v1/admin-portal/users/{id}/approve/:
    post:
      operationId: admin_portal_users_approve_create
      summary: Admin approve pending staff user
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin-portal
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
  /api/v1/admin-portal/users/{id}/change-role/:
    post:
      operationId: admin_portal_users_change_role_create
      summary: Admin change approved staff user role
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin-portal
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeRoleRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangeRoleRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangeRoleRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
  /api/v1/admin-portal/users/{id}/reject/:
    post:
      operationId: admin_portal_users_reject_create
      summary: Admin reject pending staff user
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - admin-portal
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RejectUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RejectUserRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
  /api/v1/alerts/subscriptions/:
    post:
      operationId: alerts_subscriptions_create
      description: Subscribe to threat alert broadcasts via email or SMS.
      tags:
      - alerts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionCreateRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SubscriptionCreateRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SubscriptionCreateRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionResponse'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionResponse'
          description: ''
  /api/v1/alerts/subscriptions/confirm/:
    post:
      operationId: alerts_subscriptions_confirm_create
      description: Confirm an alert subscription with secure token.
      tags:
      - alerts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionTokenRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SubscriptionTokenRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SubscriptionTokenRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionActionResponse'
          description: ''
  /api/v1/alerts/subscriptions/unsubscribe/:
    post:
      operationId: alerts_subscriptions_unsubscribe_create
      description: Unsubscribe from threat alerts with secure token.
      tags:
      - alerts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionTokenRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SubscriptionTokenRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SubscriptionTokenRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionActionResponse'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      summary: User login
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Access token returned and refresh cookie set
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      summary: User logout
      tags:
      - auth
      responses:
        '204':
          description: No response body
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      summary: Get current user profile
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
  /api/v1/auth/password/change/:
    post:
      operationId: auth_password_change_create
      summary: Change user password and revoke sessions
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/refresh/:
    post:
      operationId: auth_refresh_create
      summary: Refresh access token
      tags:
      - auth
      responses:
        '200':
          description: New access token returned and rotated cookie set
  /api/v1/auth/register/:
    post:
      operationId: auth_register_create
      summary: Citizen registration
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CitizenRegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CitizenRegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CitizenRegisterRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummary'
          description: ''
  /api/v1/auth/register/staff/:
    post:
      operationId: auth_register_staff_create
      summary: Staff registration (pending approval)
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffRegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StaffRegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StaffRegisterRequest'
        required: true
      responses:
        '201':
          description: Staff registration submitted
  /api/v1/health/:
    get:
      operationId: health_retrieve
      description: Returns 200 OK if the service is running.
      summary: Health check liveness
      tags:
      - health
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivenessResponse'
          description: ''
  /api/v1/health/ready/:
    get:
      operationId: health_ready_retrieve
      description: Returns 200 OK if the database is reachable and responsive.
      summary: Health check readiness
      tags:
      - health
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnavailableResponse'
          description: ''
  /api/v1/internal/scan-results/:
    post:
      operationId: internal_scan_results_create
      description: Receives scoring results from heuristic scanner Lambda, verified
        via HMAC-SHA256.
      summary: Internal scanner callback
      tags:
      - internal
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanResultCallbackRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ScanResultCallbackRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ScanResultCallbackRequest'
        required: true
      responses:
        '200':
          description: Scan result processed and saved successfully.
        '400':
          description: Validation error in result payload.
        '403':
          description: Invalid signature, bad timestamp, or clock skew.
        '404':
          description: Report not found.
        '429':
          description: Throttled.
  /api/v1/lookups/:
    post:
      operationId: lookups_create
      description: Lookup phone numbers, URLs, domains, emails, or bank accounts against
        known threat intel.
      tags:
      - lookups
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LookupRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LookupRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LookupRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LookupResponse'
          description: ''
  /api/v1/reports/:
    post:
      operationId: reports_create
      description: Submits a citizen scam report with 1 to 5 indicators and up to
        3 evidence files.
      summary: File a scam report
      parameters:
      - in: header
        name: Idempotency-Key
        schema:
          type: string
          format: uuid
        description: Optional idempotency key UUID to prevent duplicate submissions.
      tags:
      - reports
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReportCreateRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReportCreateRequestRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/ReportCreateRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportCreateResponse'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportCreateResponse'
          description: Idempotent replay of previously submitted report.
        '400':
          description: Validation error
        '413':
          description: Payload exceeds 16 MB limit
        '429':
          description: Rate limit exceeded
  /api/v1/reports/mine/:
    get:
      operationId: reports_mine_list
      description: Authenticated list of non-anonymous reports submitted by the caller.
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - reports
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMyReportItemList'
          description: ''
  /api/v1/reports/options/:
    get:
      operationId: reports_options_retrieve
      description: Public endpoint returning enums and country-specific allow-lists.
      summary: Retrieve report submission options and allow-lists
      tags:
      - reports
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportOptionsResponse'
          description: ''
  /api/v1/reports/track/:
    post:
      operationId: reports_track_create
      description: Public tracking endpoint. Returns uniform 404 for unknown references
        and invalid keys.
      summary: Track status of a filed report
      tags:
      - reports
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportTrackRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReportTrackRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReportTrackRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportTrackResponse'
          description: ''
        '404':
          description: Report not found
        '429':
          description: Too many failed tracking attempts
  /api/v1/triage/indicators/:
    get:
      operationId: triage_indicators_list
      description: Returns verified indicators with filtering by type, threat_level,
        status, and search.
      summary: List verified indicators
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - triage
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedVerifiedIndicatorList'
          description: ''
  /api/v1/triage/indicators/{id}/:
    get:
      operationId: triage_indicators_retrieve
      description: Returns full VerifiedIndicator details. Accessible to ANALYST and
        ADMIN.
      summary: Retrieve verified indicator detail
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - triage
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifiedIndicator'
          description: ''
    patch:
      operationId: triage_indicators_partial_update
      description: Updates public_note on a verified indicator. Restricted to ANALYST.
      summary: Curate verified indicator public note
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - triage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCurateIndicatorRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCurateIndicatorRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCurateIndicatorRequestRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifiedIndicator'
          description: ''
  /api/v1/triage/indicators/{id}/revoke/:
    post:
      operationId: triage_indicators_revoke_create
      description: Revokes an active verified indicator with a required reason. Restricted
        to ANALYST.
      summary: Revoke verified indicator
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - triage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeIndicatorRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RevokeIndicatorRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RevokeIndicatorRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifiedIndicator'
          description: ''
  /api/v1/triage/queue/:
    get:
      operationId: triage_queue_list
      description: Returns pending scam reports annotated with cluster_size.
      summary: List triage queue
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - triage
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedQueueReportList'
          description: ''
  /api/v1/triage/reports/{id}/:
    get:
      operationId: triage_reports_retrieve
      description: Returns full analyst detail for a scam report.
      summary: Get triage report detail
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - triage
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportDetail'
          description: ''
  /api/v1/triage/reports/{id}/evidence/:
    get:
      operationId: triage_reports_evidence_list
      description: Returns temporary S3 pre-signed get_object URLs (ExpiresIn=900,
        attachment) for clean evidence files.
      summary: Get evidence presigned URLs
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - triage
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EvidencePresignedResponse'
          description: ''
  /api/v1/triage/reports/{id}/reject/:
    post:
      operationId: triage_reports_reject_create
      description: Rejects a pending report with a mandatory non-blank reason (max
        500 chars).
      summary: Reject report
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - triage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectReportRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RejectReportRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RejectReportRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RejectReportResponse'
          description: ''
  /api/v1/triage/reports/{id}/verify/:
    post:
      operationId: triage_reports_verify_create
      description: Verifies a cluster of pending reports sharing an indicator, promotes
        to VerifiedIndicator, and resolves all reports in the cluster.
      summary: Verify report indicator cluster
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - triage
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyReportRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VerifyReportRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VerifyReportRequestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyReportResponse'
          description: ''
